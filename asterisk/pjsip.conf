[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

# Keep in sync with the fixed voip subnet in compose.yaml.
local_net=172.19.0.0/16
external_signaling_address=192.168.1.24
external_media_address=192.168.1.24

[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=1001-auth
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=local-dev-password

[1001]
type=aor
max_contacts=1
remove_existing=yes